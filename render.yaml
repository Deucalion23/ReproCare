# ==============================================================================
# Render Blueprint — ReproCare (Laravel 12, Docker) + managed Postgres
# ==============================================================================
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# The entrypoint (docker/entrypoint.sh) runs `php artisan migrate --force`
# and seeds only a fresh database. Configure the database driver and DB_*
# credentials as service environment variables in the Render Dashboard.
#
# NOTE: SQLite is NOT usable on Render (ephemeral filesystem wipes
# database/database.sqlite on every deploy — that data loss is exactly what
# caused the production login crash). Use the driver and connection details
# for your managed database.
# ==============================================================================

services:
  - type: web
    name: reprocare
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: ReproCare
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: SEED_TEST_SCENARIOS
        value: true
      - key: LOG_CHANNEL
        value: stderr
      # Database settings are deliberately configured in the Render service
      # dashboard. This app no longer assumes a Render-managed Postgres
      # database, so set DB_CONNECTION and the matching DB_* values there.
      - key: CACHE_STORE
        value: file
      # APP_KEY is intentionally NOT in this file: set one stable value in
      # the dashboard (php artisan key:generate --show, paste the base64:...
      # string). The entrypoint auto-generates an ephemeral key if empty,
      # which would log every user out on each redeploy.
