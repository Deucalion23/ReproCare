<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ReproCare logo</title>
  <desc id="desc">Mother and child silhouette in a soft pink gradient.</desc>
  <defs>
    <linearGradient id="softpink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9CBD3"/>
      <stop offset="38%" stop-color="#E99AA9"/>
      <stop offset="72%" stop-color="#B94A6B"/>
      <stop offset="100%" stop-color="#7D0F38"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#softpink)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer circle -->
    <circle cx="128" cy="128" r="93"/>
    <!-- inner embracing crescent (left double line) -->
    <path d="M 71 91 C 66 130 80 166 107 191"/>
    <!-- main mother body curve -->
    <path d="M 190 67 C 151 56 96 72 87 129 C 82 164 92 184 107 200"/>
    <!-- mother neck / shoulder wave -->
    <path d="M 107 96 C 117 96 120 110 125 124 C 129 136 139 138 151 135 L 163 133 C 165 118 176 109 193 98 C 203 91 207 81 208 67"/>
    <!-- baby arm loop on right -->
    <path d="M 173 171 C 170 152 179 130 201 127 C 216 125 225 137 221 151 C 217 165 198 173 173 171"/>
    <!-- lower cradle / belly -->
    <path d="M 105 198 C 122 176 156 165 198 170 C 212 172 223 169 232 163"/>
  </g>
  <!-- baby eye / teardrop -->
  <path fill="url(#softpink)" stroke="none" d="M 165 86 C 168 94 172 101 178 101 C 183 101 186 96 184 90 C 182 83 173 77 165 86 Z"/>
</svg>
