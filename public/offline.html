<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EC4899">
    <title>Offline - ReproCare</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #FDF2F8; color: #111827;
               min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .card { background: #fff; border: 1px solid #FCE7F3; border-radius: 20px; padding: 2.5rem 2rem;
                max-width: 420px; text-align: center; box-shadow: 0 8px 24px rgba(236,72,153,0.12); }
        .icon { width: 64px; height: 64px; border-radius: 18px; background: #FCE7F3; color: #DB2777;
                display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 1rem; }
        h1 { font-size: 1.3rem; margin: 0 0 0.5rem; }
        p { font-size: 0.9rem; color: #6B7280; line-height: 1.6; }
        button { background: #F472B6; color: #fff; border: none; border-radius: 12px; padding: 0.7rem 1.5rem;
                 font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📶</div>
        <h1>You are offline</h1>
        <p>ReproCare field forms still work offline — entries are saved on this device
           and sync automatically once internet returns.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
